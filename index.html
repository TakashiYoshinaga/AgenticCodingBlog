<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Three.jsとWebXRで太陽系の自転・公転を観察できる、Meta Quest対応のARデモです。"
    />
    <meta name="theme-color" content="#020610" />
    <title>太陽系 AR — Three.js WebXR Demo</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas
      id="scene-canvas"
      aria-label="太陽と8つの惑星、月を表示する3D太陽系"
      aria-describedby="celestial-description"
    ></canvas>

    <p id="celestial-description" class="sr-only">
      表示天体は、太陽、水星、金星、地球、月、火星、木星、土星、天王星、海王星です。
      各惑星は自転しながら太陽の周囲を公転し、月は地球の周囲を公転します。
    </p>

    <header id="help-panel" class="glass-panel help-panel">
      <p class="eyebrow">THREE.JS / WEBXR</p>
      <h1>太陽系 <span>AR</span></h1>
      <p class="lead">自転する惑星と、実際に近い周期比で巡る軌道を観察できます。</p>

      <dl class="control-list" aria-label="通常表示の操作方法">
        <div>
          <dt>回転</dt>
          <dd>ドラッグ / 1本指</dd>
        </div>
        <div>
          <dt>ズーム</dt>
          <dd>ホイール / ピンチ</dd>
        </div>
        <div>
          <dt>移動</dt>
          <dd>W A S D</dd>
        </div>
      </dl>
      <p class="scale-note">
        色付きの線が各惑星の軌道です。大きさと距離は観察しやすいように調整しています。
      </p>
    </header>

    <section class="xr-launch" aria-label="WebXR AR">
      <button id="ar-button" type="button" disabled>ARを確認中…</button>
      <p id="xr-status" role="status" aria-live="polite">
        この端末でARを利用できるか確認しています。
      </p>
    </section>

    <div id="xr-overlay" class="xr-overlay" aria-hidden="true">
      <div class="xr-overlay__guide">
        <span>トリガーで掴んで移動</span>
        <span>右スティック上下で拡大・縮小</span>
        <strong id="xr-scale">100%</strong>
      </div>
      <button id="xr-exit" type="button">ARを終了</button>
    </div>

    <noscript>
      <p class="no-script">このデモを表示するにはJavaScriptを有効にしてください。</p>
    </noscript>

    <script type="module" src="./main.js"></script>
  </body>
</html>
